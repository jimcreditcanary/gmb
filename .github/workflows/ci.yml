name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4      # version comes from package.json packageManager
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm validate            # frontmatter + media + locked regulatory text
      - run: pnpm build
        env: { NEXT_PUBLIC_SITE_ENV: production }
      - name: Lighthouse budget (mobile, ≥95 on every template)
        run: pnpm lhci
        env: { NEXT_PUBLIC_SITE_ENV: production }
      - name: Lighthouse budget (desktop)
        run: pnpm lhci:desktop
        env: { NEXT_PUBLIC_SITE_ENV: production }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lighthouse-reports, path: .lighthouseci, retention-days: 14 }
