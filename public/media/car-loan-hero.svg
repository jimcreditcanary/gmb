<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5A1F"/><stop offset="1" stop-color="#FF7A3D"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4F9FD"/><stop offset="1" stop-color="#CFF4FB"/></linearGradient>
  </defs>
  <!-- road / ground -->
  <ellipse cx="330" cy="352" rx="270" ry="14" fill="#102C45" opacity="0.12"/>
  <!-- sun / badge -->
  <circle cx="520" cy="86" r="42" fill="#F6C757"/>
  <circle cx="520" cy="86" r="30" fill="#FBDC8E"/>
  <!-- key tag -->
  <g transform="translate(78 70) rotate(-18)">
    <rect x="0" y="0" width="54" height="78" rx="12" fill="#DECEF9"/>
    <circle cx="27" cy="20" r="7" fill="#FFFFFF"/>
    <rect x="14" y="40" width="26" height="6" rx="3" fill="#102C45"/>
    <rect x="14" y="52" width="18" height="6" rx="3" fill="#102C45"/>
  </g>
  <!-- car body -->
  <path d="M110 300 C110 262 128 246 166 240 L212 232 L262 178 C272 166 286 160 302 160 L428 160 C446 160 462 168 474 182 L520 236 L566 246 C590 250 604 266 604 290 L604 306 C604 318 596 326 584 326 L130 326 C118 326 110 318 110 306 Z" fill="url(#body)"/>
  <!-- windows -->
  <path d="M250 236 L288 186 C294 178 304 174 314 174 L360 174 L360 236 Z" fill="url(#glass)"/>
  <path d="M378 174 L428 174 C440 174 450 180 458 190 L494 236 L378 236 Z" fill="url(#glass)"/>
  <!-- door line & handle -->
  <path d="M368 176 L368 300" stroke="#CC4512" stroke-width="4" stroke-linecap="round"/>
  <rect x="384" y="256" width="30" height="8" rx="4" fill="#CC4512"/>
  <rect x="326" y="256" width="30" height="8" rx="4" fill="#CC4512"/>
  <!-- lights -->
  <rect x="112" y="268" width="26" height="18" rx="6" fill="#F6C757"/>
  <rect x="578" y="272" width="26" height="18" rx="6" fill="#102C45" opacity="0.5"/>
  <!-- wheels -->
  <g>
    <circle cx="206" cy="318" r="40" fill="#102C45"/><circle cx="206" cy="318" r="20" fill="#DECEF9"/><circle cx="206" cy="318" r="8" fill="#102C45"/>
    <circle cx="500" cy="318" r="40" fill="#102C45"/><circle cx="500" cy="318" r="20" fill="#DECEF9"/><circle cx="500" cy="318" r="8" fill="#102C45"/>
  </g>
  <!-- price tag floating -->
  <g transform="translate(560 150)">
    <rect x="-56" y="-22" width="112" height="44" rx="22" fill="#FFFFFF"/>
    <text x="0" y="7" text-anchor="middle" font-family="Figtree, system-ui, sans-serif" font-weight="700" font-size="20" fill="#102C45">£ ?</text>
  </g>
</svg>
